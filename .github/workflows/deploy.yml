name: Deploy backend to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REDIRECT_URI: ${{ secrets.GOOGLE_DRIVE_REDIRECT_URI }}
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          STRIPE_CURRENCY: ${{ secrets.STRIPE_CURRENCY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o SendEnv=TG_BOT_TOKEN,TG_CHAT_ID \
            "$SSH_USER@$SSH_HOST" \
            "TG_BOT_TOKEN='$TG_BOT_TOKEN' TG_CHAT_ID='$TG_CHAT_ID' GOOGLE_DRIVE_CLIENT_ID='$GOOGLE_DRIVE_CLIENT_ID' GOOGLE_DRIVE_CLIENT_SECRET='$GOOGLE_DRIVE_CLIENT_SECRET' GOOGLE_DRIVE_REDIRECT_URI='$GOOGLE_DRIVE_REDIRECT_URI' STRIPE_KEY='$STRIPE_KEY' STRIPE_SECRET='$STRIPE_SECRET' STRIPE_CURRENCY='$STRIPE_CURRENCY' STRIPE_WEBHOOK_SECRET='$STRIPE_WEBHOOK_SECRET' bash -se" <<'REMOTE_EOF'
            set -euo pipefail
            cd /var/www/zulu-backend

            echo "=== Pull latest from origin/main ==="
            git fetch origin main
            git reset --hard origin/main

            # Helper: upsert KEY=VALUE in .env (creates if absent, replaces otherwise).
            upsert_env() {
              local key="$1" value="$2"
              if [ -z "${value:-}" ]; then return 0; fi
              if grep -q "^${key}=" .env; then
                # Escape | in value for sed, and use | as delimiter to avoid /
                # collisions in URLs.
                local esc; esc=$(printf '%s' "$value" | sed 's/[|&\\]/\\&/g')
                sed -i "s|^${key}=.*|${key}=${esc}|" .env
              else
                printf '\n%s=%s\n' "$key" "$value" >> .env
              fi
            }

            echo "=== Sync TELEGRAM env vars (Sprint 78) ==="
            upsert_env TELEGRAM_BOT_TOKEN "${TG_BOT_TOKEN:-}"
            upsert_env TELEGRAM_CHAT_ID "${TG_CHAT_ID:-}"

            echo "=== Sync GOOGLE DRIVE env vars (Phase Է, 2026-05-25) ==="
            upsert_env GOOGLE_DRIVE_CLIENT_ID "${GOOGLE_DRIVE_CLIENT_ID:-}"
            upsert_env GOOGLE_DRIVE_CLIENT_SECRET "${GOOGLE_DRIVE_CLIENT_SECRET:-}"
            upsert_env GOOGLE_DRIVE_REDIRECT_URI "${GOOGLE_DRIVE_REDIRECT_URI:-}"

            echo "=== Sync STRIPE env vars (Stripe Connect test, 2026-06-01) ==="
            upsert_env PAYMENT_DRIVER stripe
            upsert_env STRIPE_KEY "${STRIPE_KEY:-}"
            upsert_env STRIPE_SECRET "${STRIPE_SECRET:-}"
            upsert_env STRIPE_CURRENCY "${STRIPE_CURRENCY:-}"
            upsert_env STRIPE_WEBHOOK_SECRET "${STRIPE_WEBHOOK_SECRET:-}"

            echo "=== Ensure PHP BCMath extension (idempotent) ==="
            # 2026-06-01: marketplace bookings, pricing resolver + commission
            # service rely on bcadd/bcmul/bcdiv. Production runner was missing
            # php8.3-bcmath and every POST /marketplace/bookings 500'd. Install
            # is idempotent — apt-get does nothing if already present.
            if ! php -m | grep -qi '^bcmath$'; then
              DEBIAN_FRONTEND=noninteractive apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends php8.3-bcmath
              systemctl reload php8.3-fpm
            fi

            echo "=== Composer install (production) ==="
            COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction

            echo "=== Database migrations ==="
            php artisan migrate --force

            echo "=== Caches ==="
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "=== Public storage symlink ==="
            # public/storage → storage/app/public so files saved by
            # MediaUploadController (operator logos, hotel/package main images,
            # banners, etc.) are served at https://api.zulu.am/storage/...
            # without this symlink nginx returns 404 and uploaded images show
            # as broken-icon previews in the admin UI (caught 2026-06-04 on
            # the Partner-settings logo upload). Idempotent — `--force` simply
            # re-creates if the link is missing or points elsewhere.
            php artisan storage:link --force

            echo "=== Storage ownership (fix root-owned files from artisan-as-root above) ==="
            # Every artisan command in this script runs as root, which creates
            # root-owned files in bootstrap/cache + storage/framework/{views,cache}.
            # PHP-FPM runs as www-data and cannot write the next time a cache key
            # turns over, surfacing as 500s on /api/* (caught in Sentry repeatedly
            # 2026-05-21). Chown after caches so the runtime user can write.
            chown -R www-data:www-data \
              /var/www/zulu-backend/bootstrap/cache \
              /var/www/zulu-backend/storage

            echo "=== Reload services ==="
            systemctl reload php8.3-fpm
            systemctl reload nginx

            echo "=== Deploy SHA ==="
            git rev-parse --short HEAD
          REMOTE_EOF

      - name: Smoke test
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://api.zulu.am/ || echo 000)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Smoke test failed: api.zulu.am did not return 200"
          exit 1

      - name: Notify Telegram on success
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          FIRST_LINE="$(printf '%s' "$COMMIT_MSG" | head -n 1)"
          MESSAGE=$(printf '✅ <b>ZULU backend deployed</b>\n<b>Repo:</b> %s\n<b>Commit:</b> <code>%s</code> — %s\n<b>Author:</b> %s\n<a href="%s">View run</a>' \
            "$REPO" "$SHORT_SHA" "$FIRST_LINE" "$AUTHOR" "$RUN_URL")
          PAYLOAD=$(jq -nc \
            --arg chat "$TG_CHAT_ID" \
            --arg text "$MESSAGE" \
            '{chat_id: $chat, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD" > /dev/null

      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          FIRST_LINE="$(printf '%s' "$COMMIT_MSG" | head -n 1)"
          MESSAGE=$(printf '🚨 <b>ZULU backend deploy FAILED</b>\n<b>Repo:</b> %s\n<b>Commit:</b> <code>%s</code> — %s\n<b>Author:</b> %s\n<a href="%s">View logs</a>' \
            "$REPO" "$SHORT_SHA" "$FIRST_LINE" "$AUTHOR" "$RUN_URL")
          PAYLOAD=$(jq -nc \
            --arg chat "$TG_CHAT_ID" \
            --arg text "$MESSAGE" \
            '{chat_id: $chat, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD" > /dev/null
