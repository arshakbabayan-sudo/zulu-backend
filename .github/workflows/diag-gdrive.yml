name: Diag GoogleDrive status 500

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Read prod logs + schema
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE_EOF'
          set -uo pipefail
          cd /var/www/zulu-backend
          echo "=== deployed HEAD ==="
          git rev-parse HEAD
          echo
          echo "=== google env present (names only, lengths) ==="
          grep -nE "^GOOGLE_DRIVE_" .env | sed -E 's/=(.*)$/= [len \1]/; s/\[len (.*)\]/[len="$(echo -n placeholder)"]/' || true
          awk -F= '/^GOOGLE_DRIVE_/{printf "%s = len:%d\n",$1,length($2)}' .env
          echo
          echo "=== ANIE row google fields (raw) ==="
          php artisan tinker --execute="\$c=\App\Models\Company::where('name','like','%ANIE%')->first(); echo \$c ? ('id='.\$c->id.' refresh_len='.strlen((string)\$c->getRawOriginal('google_refresh_token')).' folder='.var_export(\$c->getRawOriginal('google_drive_folder_id'),true)) : 'no ANIE';" 2>&1 | grep -v Deprecat | tail -3
          echo
          echo "=== EXACT exception around the last createAuthUrl failure ==="
          LOG=$(ls -t storage/logs/*.log 2>/dev/null | head -1); echo "LOG=$LOG"
          LINE=$(grep -n "createAuthUrl" "$LOG" | tail -1 | cut -d: -f1)
          echo "last createAuthUrl frame at line: $LINE"
          if [ -n "${LINE:-}" ]; then sed -n "$((LINE-55)),$((LINE+1))p" "$LOG"; fi
          REMOTE_EOF
